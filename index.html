<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="theme-color" content="#f2ecdf"/>
<meta name="apple-mobile-web-app-title" content="3.09"/>
<meta name="application-name" content="3.09"/>
<meta name="mobile-web-app-capable" content="yes"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"/>
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png"/>
<link rel="manifest" href="manifest.webmanifest"/>
<title>Marathon Trainer — Valencia 2026</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f2ecdf; --bg2:#ece4d3; --card:#fbf9f2; --card2:#f4eede; --ink:#211d16; --muted:#8c8371;
  --line:#e6ddc9; --gold:#997522; --gold2:#b98f37; --goldsoft:#efe6ce; --green:#3f7a52; --greensoft:#e2ecdd;
  --shadow:0 1px 2px rgba(40,32,10,.05),0 6px 18px rgba(40,32,10,.05); --radius:16px;
}
[data-theme="dark"]{
  --bg:#16140f; --bg2:#1d1a13; --card:#211e17; --card2:#26221a; --ink:#f1ebdd; --muted:#a39a86;
  --line:#332e23; --gold:#cBA35a; --gold2:#d8b466; --goldsoft:#302913; --green:#7cb791; --greensoft:#22301f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35);
}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;font-size:16px;line-height:1.45}
.serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
/* header */
.hdr{position:sticky;top:0;z-index:20;background:var(--bg);padding:14px 2px 10px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--line);margin:0 -16px 14px;padding-left:16px;padding-right:16px}
.hdr .mark{display:flex;align-items:center;gap:9px}
.hdr .logo{width:26px;height:26px;border-radius:7px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:13px;font-weight:700;letter-spacing:-.5px}
.hdr .htxt{font-size:12.5px;font-weight:650;letter-spacing:.02em}
.hdr .hsub{font-size:11px;color:var(--muted)}
.count{text-align:right}
.count b{color:var(--gold);font-size:15px}
.count span{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
/* labels + text */
.lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.dim{color:var(--muted)}
h1,h2,h3{margin:0}
.title{font-size:30px;line-height:1.08;font-weight:600;letter-spacing:-.01em}
.section-t{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);font-weight:700;margin:22px 2px 10px}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.card.pace{background:var(--card2)}
.card.sess{border-left:4px solid var(--gold);padding-left:18px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.kv{padding:11px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.kv .lbl{display:block;margin-bottom:3px}
.kv .v{font-size:16px;font-weight:600}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  padding:4px 10px;border-radius:999px;background:var(--greensoft);color:var(--green)}
.badge.strong{background:var(--goldsoft);color:var(--gold)}
.badge.controlled{background:#e9e3f0;color:#6b5ca0}
[data-theme="dark"] .badge.controlled{background:#241f2e;color:#a99cd6}
.badge.rest{background:var(--bg2);color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
/* big pace */
.pace-big{font-size:38px;font-weight:600;letter-spacing:-.02em;margin:2px 0}
.pace-sub{font-size:12.5px;color:var(--muted)}
/* day pills */
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px;margin:0 -2px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;padding:9px 15px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.pill.on{border-color:var(--gold);color:var(--gold);background:var(--goldsoft)}
.pill.rest{font-style:italic}
/* buttons */
button{font-family:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:12px;
  background:var(--ink);color:var(--bg);font-size:16px;font-weight:650;padding:14px;box-shadow:var(--shadow)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.sm{width:auto;padding:9px 14px;font-size:14px;border-radius:10px}
.iconbtn{width:38px;height:38px;border-radius:10px;background:var(--ink);color:var(--bg);border:0;display:grid;place-items:center;font-size:17px}
.iconbtn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.iconbtn:disabled{opacity:.35}
/* nav arrows in today */
.navrow{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:6px}
/* collapsible */
.acc{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);margin-bottom:12px}
.acc .head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;font-weight:600;cursor:pointer}
.acc .body{padding:0 16px 14px}
.acc .chev{color:var(--muted);transition:transform .18s}
.acc.open .chev{transform:rotate(180deg)}
.oea .lbl{margin-top:12px;display:block;margin-bottom:3px}
.oea p{margin:0}
.note{background:var(--card2);border-left:3px solid var(--gold);border-radius:0 12px 12px 0;padding:14px 16px;margin-bottom:12px}
.note .lbl{color:var(--gold);margin-bottom:6px;display:block}
.note p{margin:0;font-style:italic;color:var(--ink);opacity:.9}
/* forms */
label.field{display:block;margin-bottom:12px}
label.field .lbl{margin-bottom:6px;display:block}
input,select,textarea{width:100%;font-family:inherit;font-size:16px;color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:11px;padding:12px 13px}
input:focus,select,textarea:focus{outline:2px solid var(--goldsoft)}
textarea{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
/* segmented */
.seg{display:flex;background:var(--bg2);border-radius:11px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font-weight:650;font-size:13.5px;padding:9px 6px;border-radius:8px}
.seg button.on{background:var(--ink);color:var(--bg);box-shadow:var(--shadow)}
/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));max-width:480px;margin:0 auto}
.tab{flex:1;background:0;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;padding:4px 0}
.tab.on{color:var(--gold)}
.tab svg{width:22px;height:22px}
/* plan list */
.wk{border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:10px;overflow:hidden}
.wk .head{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;cursor:pointer;gap:10px}
.wk.cur{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.phase-tag{font-size:10px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--goldsoft);color:var(--gold)}
.dayline{display:flex;justify-content:space-between;gap:10px;padding:10px 15px;border-top:1px solid var(--line);cursor:pointer}
.dayline:hover{background:var(--card2)}
.dayline .d{font-weight:600;min-width:34px;color:var(--muted)}
.dayline .t{flex:1}
.dayline .m{font-size:12px;color:var(--muted)}
/* log items */
.logitem{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.logitem:first-child{border-top:0}
.logitem .del{color:var(--muted);background:0;border:0;font-size:18px;padding:0 4px}
.pill-mini{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:6px;background:var(--card2);color:var(--muted)}
.stat{display:flex;gap:14px;flex-wrap:wrap}
.stat .b{font-size:22px;font-weight:600}
.embed{position:relative;padding-bottom:56.25%;height:0;border-radius:12px;overflow:hidden;margin-top:6px;background:var(--bg2)}
.embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vidpills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.vpill{border:1px solid var(--line);background:var(--card2);color:var(--muted);border-radius:999px;min-width:34px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer}
.vpill.on{background:var(--gold);color:#fff;border-color:var(--gold)}
/* running pyramid */
.pyr-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:2px}
.pyr-range{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 12px}
.rpill{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:700;cursor:pointer}
.rpill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pyr-stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.ptile{flex:1 1 0;min-width:74px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.ptile b{display:block;font-size:19px;font-weight:600;letter-spacing:-.01em}
.ptile span{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;margin-top:1px}
.zlegend{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.zchip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:11px;font-weight:700;letter-spacing:.03em;color:var(--muted);cursor:pointer}
.zchip .sw{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.zchip.on{border-color:var(--ink);color:var(--ink)}
.zchip.all.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pyr-rows{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 0 6px}
.pyr-row{display:flex;justify-content:center;gap:7px}
.brick{position:relative;flex:0 0 auto;width:clamp(40px,13vw,58px);height:34px;border-radius:9px;border:0;padding:0;cursor:pointer;
  box-shadow:0 1px 2px rgba(40,32,10,.22),inset 0 1px 0 rgba(255,255,255,.28);display:grid;place-items:center;
  transition:transform .12s ease,opacity .12s ease,box-shadow .12s ease}
.brick .bc{font-size:8px;font-weight:800;letter-spacing:.02em;color:rgba(255,255,255,.78);text-shadow:0 1px 1px rgba(0,0,0,.22)}
.brick:hover{transform:translateY(-2px);box-shadow:0 3px 8px rgba(40,32,10,.28),inset 0 1px 0 rgba(255,255,255,.28)}
.brick.dim{opacity:.2}
.brick.sel{transform:translateY(-2px)}
.brick.sel::after{content:"";position:absolute;inset:-3px;border-radius:11px;border:2.5px solid var(--ink)}
.brick:focus-visible{outline:0}
.brick:focus-visible::after{content:"";position:absolute;inset:-3px;border-radius:11px;border:2.5px solid var(--ink)}
.pyr-detail{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin:4px 0 4px}
.pyr-empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;color:var(--muted);font-size:13.5px}
.pyr-uncl{font-size:12px;color:var(--muted);margin:8px 2px 0}
.dist-bar{display:flex;height:12px;border-radius:999px;overflow:hidden;border:1px solid var(--line);margin:10px 0}
.dist-bar > i{display:block;height:100%}
.drow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.drow:first-child{border-top:0}
.drow .dk{display:flex;align-items:center;gap:9px}
.drow .sw{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
.distlabel{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:5px 12px;border-radius:999px}
.infobtn{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:11px;font-weight:700;line-height:1;display:inline-grid;place-items:center;cursor:pointer;flex:0 0 auto}
.infonote{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:12.5px;color:var(--muted);margin:2px 0 12px;line-height:1.5}
@media (prefers-reduced-motion: reduce){.brick,.brick:hover,.brick.sel{transition:none;transform:none}}
.hintbar{font-size:12px;color:var(--muted);background:var(--card2);border-radius:10px;padding:9px 12px;margin-top:6px}
.link{color:var(--gold);font-weight:600;text-decoration:none}
.sr-gap{height:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));z-index:50;
  background:var(--green);color:#fff;padding:11px 18px;border-radius:999px;font-weight:650;font-size:14px;box-shadow:var(--shadow)}
.chip{display:inline-block;font-size:11px;font-weight:600;color:var(--muted);background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;margin:0 6px 6px 0}
/* ---- daily check-in ---- */
.ci-scrim{position:fixed;inset:0;z-index:60;background:rgba(28,22,8,.42);display:flex;align-items:flex-end;justify-content:center;
  backdrop-filter:saturate(120%) blur(2px)}
.ci-sheet{width:100%;max-width:480px;background:var(--bg);border-radius:22px 22px 0 0;border-top:1px solid var(--line);
  max-height:92vh;display:flex;flex-direction:column;box-shadow:0 -8px 40px rgba(30,24,8,.22)}
.ci-grip{width:38px;height:4px;border-radius:99px;background:var(--line);margin:9px auto 2px;flex:none}
.ci-body{padding:8px 18px calc(22px + env(safe-area-inset-bottom));overflow-y:auto}
.ci-stack{display:flex;flex-direction:column;gap:8px}
.ci-opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;width:100%;
  background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 15px;color:var(--ink)}
.ci-opt b{font-size:15.5px;font-weight:650}
.ci-opt span{font-size:12.5px;color:var(--muted)}
.ci-opt.on{border-color:var(--gold);background:var(--goldsoft)}
.ci-row{display:flex;gap:8px}
.ci-half,.ci-third{flex:1;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 8px;
  color:var(--ink);font-weight:600;font-size:13.5px}
.ci-half.on,.ci-third.on{border-color:var(--gold);background:var(--goldsoft);color:var(--gold)}
.ci-chips{display:flex;flex-wrap:wrap;gap:6px}
.ci-chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;color:var(--ink);font-weight:600}
.ci-chip.on{border-color:var(--gold);background:var(--goldsoft);color:var(--gold)}
.ci-scale{display:flex;gap:4px}
.ci-num{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 0;font-size:13px;font-weight:650;color:var(--ink)}
.ci-num.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ci-num.hi.on{background:#a9432f;border-color:#a9432f;color:#fff}
.ci-flag{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin-top:14px;
  background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:12px 13px;color:var(--ink)}
.ci-flag b{flex:none;width:20px;height:20px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;background:var(--bg)}
.ci-flag span{font-size:13px;line-height:1.35}
.ci-flag.on{border-color:#a9432f;border-style:solid;background:rgba(169,67,47,.07)}
.ci-flag.on b{background:#a9432f;color:#fff;border-color:#a9432f}
/* verdict */
.ci-verdict{border-radius:15px;padding:15px 16px;margin:10px 0 14px;border:1px solid var(--line);background:var(--card)}
.ci-verdict.green{border-left:4px solid var(--green);background:var(--greensoft)}
.ci-verdict.amber{border-left:4px solid var(--gold2);background:var(--goldsoft)}
.ci-verdict.red{border-left:4px solid #a9432f;background:rgba(169,67,47,.08)}
.ci-verdict .vh{font-size:19px;font-weight:650;font-family:"Iowan Old Style",Palatino,Georgia,serif}
.ci-verdict .vc{margin:6px 0 0;font-size:15px;font-weight:600}
.ci-verdict .vw{margin:8px 0 0;font-size:13.5px;line-height:1.45;color:var(--muted)}
.ci-verdict .vr{display:inline-block;margin-top:9px;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
/* fuel */
.ci-fuel{border:1px solid var(--line);background:var(--card);border-radius:15px;padding:15px 16px}
.ci-fuel .fh{font-size:17px;font-weight:650;margin-top:3px}
.ci-fuel .fw{margin:5px 0 10px;font-size:13.5px;color:var(--muted);line-height:1.45}
.ci-target{display:flex;align-items:baseline;gap:9px;padding:11px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:8px}
.ci-target b{font-size:24px;color:var(--gold);font-family:"Iowan Old Style",Palatino,Georgia,serif;font-weight:600}
.ci-target span{font-size:12px;color:var(--muted);line-height:1.3}
.ci-lines{display:flex;flex-direction:column}
.ci-lines>div{display:flex;gap:11px;padding:9px 0;border-top:1px solid var(--line)}
.ci-lines>div:first-child{border-top:0}
.ci-lines i{flex:none;width:66px;font-style:normal;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--muted);font-weight:650;padding-top:3px}
.ci-lines span{flex:1;font-size:13.5px;line-height:1.45}
.ci-kg{display:flex;align-items:center;gap:10px;background:var(--bg2);border-radius:11px;padding:10px 12px;margin-bottom:10px}
.ci-kg span{flex:1;font-size:13px;color:var(--muted)}
.ci-kg input{width:78px;margin:0;text-align:center}
.ci-portions{display:flex;flex-direction:column;gap:5px}
.ci-portions div{font-size:14px;padding-left:14px;position:relative}
.ci-portions div:before{content:"·";position:absolute;left:2px;color:var(--gold);font-weight:700}
.ci-next{display:flex;gap:11px;background:var(--bg2);border-radius:11px;padding:11px 12px;margin-top:10px}
.ci-next i{flex:none;width:66px;font-style:normal;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:650;padding-top:2px}
.ci-next span{flex:1;font-size:13px;line-height:1.45}
/* applied-adjustment banner */
.adjbar{border-radius:15px;padding:14px 15px;margin-bottom:12px;border:1px solid var(--line);background:var(--card)}
.adjbar.green{border-left:4px solid var(--green);background:var(--greensoft)}
.adjbar.amber{border-left:4px solid var(--gold2);background:var(--goldsoft)}
.adjbar.red{border-left:4px solid #a9432f;background:rgba(169,67,47,.08)}
.adjbar .ah{font-size:12px;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--muted)}
.adjbar .ac{margin:5px 0 0;font-size:15px;font-weight:600;line-height:1.4}
.adjbar .aw{margin:8px 0 0;font-size:13px;color:var(--muted);line-height:1.45}
.refs{display:flex;flex-direction:column;gap:11px}
.refs div{display:flex;flex-direction:column;gap:2px}
.refs b{font-size:13.5px;font-weight:650}
.refs span{font-size:13px;color:var(--muted);line-height:1.45}
.checkin-btn{margin-bottom:12px}
.ci-day{display:flex;flex-direction:column}
.ci-day>div{display:flex;align-items:baseline;gap:9px;padding:9px 0;border-top:1px solid var(--line)}
.ci-day>div:first-child{border-top:0}
.ci-day i{flex:none;width:82px;font-style:normal;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:650}
.ci-day span{flex:1;font-size:13.5px;line-height:1.4}
.ci-day b{flex:none;font-size:12.5px;color:var(--gold);font-weight:650}
</style>
</head>
<body>
<div id="splash" aria-label="Valencia Marathon 2026 — 3.09">
  <img class="bg" src="start.jpg" alt="" aria-hidden="true"/>
  <video class="fg" id="splashVid" src="start.mp4" poster="start-poster.jpg" muted autoplay loop playsinline preload="auto"></video>
  <div id="splashCta">
    <button id="splashGo" type="button">LET&rsquo;S GO KID</button>
  </div>
</div>
<style>
#splash{position:fixed;inset:0;z-index:9999;background:#0c0b09;display:block;
  transition:opacity .5s ease;overflow:hidden;-webkit-tap-highlight-color:transparent}
#splash .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(30px) brightness(.5);transform:scale(1.12)}
#splash .fg{position:absolute;top:0;left:0;width:100%;height:calc(100% - 96px);object-fit:contain;background:transparent}
#splashCta{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);z-index:2;
  display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 16px}
#splashHint{display:none;font:600 12px/1 -apple-system,system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;
  color:#fff;background:rgba(0,0,0,.5);padding:8px 13px;border-radius:999px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#splashCta.armed #splashHint{display:block}
#splashGo{border:1.5px solid rgba(206,165,90,.85);border-radius:999px;padding:16px 38px;
  font:700 16px/1 -apple-system,system-ui,sans-serif;letter-spacing:.09em;
  background:rgba(20,16,11,.93);color:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:goPulse 2s ease-in-out infinite}
#splashCta.armed #splashGo{background:#997522;border-color:#b98f37}
@keyframes goPulse{0%,100%{box-shadow:0 8px 24px rgba(0,0,0,.45)}50%{box-shadow:0 8px 30px rgba(206,165,90,.55)}}
#splash.hide{opacity:0;pointer-events:none}
</style>
<script>
(function(){
  function boot(){
    var s=document.getElementById('splash'); if(!s) return;
    var v=document.getElementById('splashVid');
    var cta=document.getElementById('splashCta');
    var go=document.getElementById('splashGo');
    var done=false, soundOn=false;
    function enter(){ if(done) return; done=true; try{ if(v) v.pause(); }catch(e){} s.classList.add('hide'); setTimeout(function(){ s.style.display='none'; },520); }
    function arm(){ if(cta) cta.classList.add('armed'); if(go) go.innerHTML='LET&rsquo;S GO KID &rarr;'; }
    function playSound(){ if(!v||soundOn) return; soundOn=true; v.muted=false; try{ v.currentTime=0; }catch(e){} var p=v.play&&v.play(); if(p&&p.catch) p.catch(function(){}); }
    if(v){
      // try to open WITH sound; where the browser blocks it, fall back to a muted looping autoplay
      v.muted=false;
      var p=v.play&&v.play();
      if(p&&p.then){ p.then(function(){ soundOn=true; arm(); }).catch(function(){ v.muted=true; var q=v.play&&v.play(); if(q&&q.catch) q.catch(function(){}); }); }
    }
    // first press turns the music on; second press enters the app
    if(go) go.addEventListener('click', function(ev){ ev.stopPropagation(); if(!soundOn){ playSound(); arm(); } else { enter(); } });
  }
  if(document.readyState!=='loading') boot(); else document.addEventListener('DOMContentLoaded', boot);
})();
</script>

<script>/* Marathon Trainer — single-file personal app for Paul (Valencia 2026, sub-3:10) */
const { h, render, Fragment } = window.preact;

/* ---------------- storage: prefer window.storage, then IndexedDB, then localStorage, then memory --- */
const Store = (() => {
  const mem = {};
  const idb = (() => {
    try {
      if (!window.indexedDB) return null;
      let dbp;
      const open = () => dbp || (dbp = new Promise((res, rej) => {
        const r = indexedDB.open('mtp', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);

        get: (k) => open().then(db => new Promise((res, rej) => {
          const t = db.transaction('kv', 'readonly').objectStore('kv').get(k);
          t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error);
        })),
        set: (k, v) => open().then(db => new Promise((res, rej) => {
          const t = db.transaction('kv', 'readwrite').objectStore('kv').put(v, k);
          t.onsuccess = () => res(); t.onerror = () => rej(t.error);
        }))
      };
    } catch (e) { return null; }
  })();
  const back = (() => {
    const ws = typeof window !== 'undefined' ? window.storage : null;
    if (ws) {
      if (typeof ws.get === 'function' && typeof ws.set === 'function')
        return { name: 'window.storage', get: k => Promise.resolve(ws.get(k)), set: (k, v) => Promise.resolve(ws.set(k, v)) };
      if (typeof ws.getItem === 'function' && typeof ws.setItem === 'function')
        return { name: 'window.storage', get: k => Promise.resolve(ws.getItem(k)), set: (k, v) => Promise.resolve(ws.setItem(k, v)) };
    }
    if (idb) return { name: 'on-device (IndexedDB)', get: idb.get, set: idb.set };
    try {
      if (window.localStorage) {
        localStorage.setItem('__t', '1'); localStorage.removeItem('__t');
        return { name: 'on-device (localStorage)', get: k => Promise.resolve(localStorage.getItem(k)), set: (k, v) => Promise.resolve(localStorage.setItem(k, v)) };
      }
    } catch (e) {}
    return { name: 'session-only (memory)', get: k => Promise.resolve(mem[k] == null ? null : mem[k]), set: (k, v) => { mem[k] = v; return Promise.resolve(); } };
  })();
  return {
    name: back.name,
    getJSON: (k, def) => back.get(k).then(v => {
      if (v == null) return def;
      try { return typeof v === 'string' ? JSON.parse(v) : v; } catch (e) { return def; }
    }).catch(() => def),
    setJSON: (k, v) => back.set(k, JSON.stringify(v)).catch(() => {})
  };
})();

function usePersistent(key, def, mergeObj) {
  const [val, setVal] = useState(def);
  const loaded = useRef(false);
  useEffect(() => {
    let live = true;
    Store.getJSON(key, null).then(v => {
      if (!live) return;
      if (v != null) setVal(mergeObj && typeof v === 'object' && !Array.isArray(v) ? { ...def, ...v } : v);

    });
    return () => { live = false; };
  }, []);

  return [val, setVal];
}

/* ---------------- time / pace helpers ---------------- */
const MAR = 42.195, MI = 1.609344;
const pad = n => String(n).padStart(2, '0');
function parseTime(str) { // "h:mm:ss" | "mm:ss" -> seconds

  const p = String(str).trim().split(':').map(s => Number(s));
  if (p.some(isNaN)) return null;
  if (p.length === 3) return p[0] * 3600 + p[1] * 60 + p[2];
  if (p.length === 2) return p[0] * 60 + p[1];
  if (p.length === 1) return p[0] * 60;
  return null;
}
const fmtClock = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60; return h ? `${h}:${pad(m)}:${pad(r)}` : `${m}:${pad(r)}`; };
const fmtPaceVal = s => { s = Math.round(s); return `${Math.floor(s / 60)}:${pad(s % 60)}`; };

const DIST = { '5k': 5, '10k': 10, hm: 21.0975, full: MAR };
function riegel(fromSecPerKm, dkm) { return fromSecPerKm * Math.pow(dkm / MAR, 0.06); }
function marathonEquivSec(distKm, timeSec) { // convert any race to marathon-equivalent time
  return timeSec * Math.pow(MAR / distKm, 1.06);
}
function zonesFrom(currentMarSec) {
  const MP = currentMarSec / MAR; // sec/km
  const Phm = riegel(MP, 21.0975), P15 = riegel(MP, 15), P5 = riegel(MP, 5), P3 = riegel(MP, 3);
  return {
    MP,
    recovery: [MP + 75, MP + 120],
    easy: [MP + 45, MP + 90],
    long: [MP + 50, MP + 80],
    steady: [MP + 20, MP + 40],
    marathon: [MP, MP],
    threshold: [P15, Phm + 6],
    vo2: [P3, P5]
  };
}

/* ---------------- plan config ---------------- */
const PLAN_START = '2026-08-17';  // Monday
const RACE_DATE = '2026-12-06';   // Sunday, week 16
const DOW = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

function dateOfIndex(i) { return new Date(ymd(PLAN_START) + i * 86400000); }
function fmtDate(dt) { return `${DOW[(dt.getUTCDay() + 6) % 7]} ${dt.getUTCDate()} ${MON[dt.getUTCMonth()]}`; }
function todayIndex() {
  let now = window.__TODAY__ ? new Date(window.__TODAY__) : new Date();
  const t = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((t - ymd(PLAN_START)) / 86400000);

function dateStrOfIndex(i) { const d = dateOfIndex(i); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; }

const TIPS = {

      change: MODIFY[s.type] || 'Keep the session, drop about 20% of the volume.',
      why: 'Pain of 3–5/10 that eases with a warm-up and settles overnight is within acceptable limits — it does not require rest, but it does mean removing the part of the session that provokes it. Check it again tomorrow morning.',
      ref: 'Silbernagel 2007'
    };
    return {
      level: 'go', tone: 'green', head: 'Run as written',
      change: 'No change. Session stands.',
      why: 'Pain under 3/10 that warms up and settles overnight is background noise, not injury. Log it so the week-to-week trend is visible.',
      ref: 'Silbernagel 2007'
    };
  }
  if (f === 'wrecked') return {
    level: 'down', tone: 'red', head: 'Downgrade today',
    change: DOWNGRADE[s.type] || 'Easy 30 min or rest.',
    why: 'Self-reported wellness tracks accumulated load more sensitively than HRV. One genuinely wrecked day is a signal worth acting on, and a quality session run in this state gives you the cost without the adaptation.',
    ref: 'Saw 2016'
  };
  if (f === 'flat') {
    const q = ['threshold', 'hills', 'marathon'].indexOf(s.type) >= 0;
    return {
      level: q ? 'modify' : 'go', tone: q ? 'amber' : 'green',
      head: q ? 'Judge it off the first rep' : 'Run as written',
      change: q ? 'Start the session as written. If the first rep is more than about 5 s/km off target at the right effort, convert the rest to easy aerobic and move the session to Saturday.' : 'No change. Easy days are meant to feel unremarkable.',
      why: q ? 'A single flat day is a poor reason to cancel quality work — flatness often clears in the warm-up. Two flat days in a row before a quality session is a different matter and should be treated as accumulated fatigue.' : 'Flat on an easy day is expected and is not a reason to change anything.',
      ref: 'Saw 2016'
    };
  }
  if (f === 'fresh') return {
    level: 'go', tone: 'green', head: 'Run as written',
    change: 'No change. Fresh means you may sit at the faster end of the prescribed range — it does not mean adding distance or reps.',
    why: 'There is good evidence for reducing load when the signals are poor, and none for adding load when they are good. Unplanned upgrades on good days are the commonest way a build ends early.',
    ref: 'Saw 2016'
  };
  return { level: 'go', tone: 'green', head: 'Run as written', change: 'No change. Session stands.', why: 'Nothing flagged.', ref: '' };
}

const MODIFY = {
  threshold: 'Keep the reps, but run them on flat ground and drop the final rep. Full easy warm-up.',
  hills: 'Swap the hills for the same duration at threshold effort on the flat — removes the eccentric and impact load without losing the stimulus.',
  marathon: 'Keep the marathon-pace block, cut the easy volume either side of it by about a third.',
  long: 'Cap it at three-quarters of the distance and run it as loops so you can stop early without a long walk home.',
  aerobic: 'Keep it easy, cut about 20% of the distance.',
  recovery: 'Cut to 20–25 min, or walk it.',
  rest: 'It is a rest day. Nothing to change.'
};
const DOWNGRADE = {
  threshold: 'Replace with 30–40 min easy at recovery pace, or bike/pool instead.',
  hills: 'Replace with 30–40 min easy on the flat, or bike/pool instead.',
  marathon: 'Replace with 30–40 min easy. Keep the marathon-pace work for when you can do it properly.',
  long: 'Halve the distance and run it easy, or cross-train for the same duration.',
  aerobic: 'Easy 20–30 min, or take it off.',
  recovery: 'Take it off, or walk.',
  rest: 'It is already a rest day.'
};

/* If the body check has changed the session, the day's fuel demand changes with it.
   Returns the session the fuel target should actually be built from. */
function effectiveSession(s, level) {
  if (!level || level === 'go' || level === 'modify') return s;
  if (level === 'stop') return { ...s, type: 'rest', km: 0, title: s.title, volume: '—', adjusted: 'not running' };
  const km = Math.round((s.km || 0) * (s.type === 'long' ? 0.5 : 0.6) * 10) / 10;
  return { ...s, type: km ? 'aerobic' : 'rest', km, zone: 'easy', adjusted: 'downgraded' };
}

/* ---------- fuel bundle for a day ---------- */
function fuelFor(s0, z, kg, idx, level) {
  const s = effectiveSession(s0, level);
  const m = estMin(s, z);
  const raceIdx = 111;
  const dtr = (idx != null && idx <= raceIdx) ? raceIdx - idx : null;
  const tier = choTier(s, m, dtr != null && dtr <= 2 && dtr > 0 ? dtr : null);
  const g = kg ? [Math.round(tier.g[0] * kg / 5) * 5, Math.round(tier.g[1] * kg / 5) * 5] : null;
  return { m, tier, g, adjusted: s.adjusted || null, perMeal: !!tier.perMeal, inrun: inRunPlan(s, m), pp: prePost(s, m), day: (g && !tier.perMeal && tier.head !== 'Nothing special needed') ? sampleDay((g[0] + g[1]) / 2) : [] };
}

function nextAdvice(nxt, z, kg) {
  const m = estMin(nxt.s, z);

  if (m >= 120) return 'Tonight is the meal that matters: get a large carbohydrate dinner in' + (kg ? ' (~' + Math.round(2 * kg / 5) * 5 + '–' + Math.round(3 * kg / 5) * 5 + ' g in the evening)' : '') + ', then a familiar breakfast 2–3 h before.';

  return 'No special preparation needed today.';

function toEmbed(url) {
  if (!url) return null;
  try {
    let m = url.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{6,})/);
    if (m) return 'https://www.youtube.com/embed/' + m[1];
    m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
    if (m) return 'https://player.vimeo.com/video/' + m[1];
  } catch (e) {}
  return null;
}

        })}
      </div>`;
    })}
    <div class="sr-gap"></div>
  </div>`;
}

/* ---------------- Zones view ---------------- */
function RunningPyramid({ logs, unit, setTab }) {
  const [days, setDays] = useState(28);
  const [selId, setSelId] = useState(null);
  const [hovId, setHovId] = useState(null);
  const [filterZone, setFilterZone] = useState(null);
  const [showInfo, setShowInfo] = useState(false);
  const [mode, setMode] = useState('time');
  const [cols, setCols] = useState(6);
  useEffect(() => {
    const f = () => { const w = Math.min(window.innerWidth, 468) - 6; setCols(Math.max(5, Math.min(7, Math.floor(w / 66)))); };
    f(); window.addEventListener('resize', f); return () => window.removeEventListener('resize', f);
  }, []);
  useEffect(() => { setSelId(null); setHovId(null); setFilterZone(null); }, [days]);

  const dispDist = km => unit === 'mi' ? (km / MI).toFixed(2) + ' mi' : km.toFixed(1) + ' km';
  const fmtDur = s => { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60); return h ? `${h}h ${pad(m)}m` : `${m}m`; };
  const rangeLabel = days === 7 ? '7 days' : days === 28 ? '28 days' : days === 42 ? '6 weeks' : '12 weeks';
  const dateStr = d => fmtDate(new Date(ymd(d)));

  let build;
  try {
    const win = filterWindow(dedupeRuns(logs), days, todayStr());
    const classified = [], unclassified = [];
    for (const l of win) {
      if (!isRun(l)) continue;
      const cls = classifyLog(l);
      if (cls) classified.push({ ...l, zone: cls.zone, band: cls.band });
      else unclassified.push(l);
    }
    const totalSec = classified.reduce((a, l) => a + (+l.sec || 0), 0);
    const sortedRuns = classified.slice().sort((a, b) => ZRANK(a.zone) - ZRANK(b.zone) || (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
    let brickList, unitSec = null;
    if (mode === 'time') {
      unitSec = timeUnitFor(totalSec, 44);
      brickList = []; let n = 0;
      for (const r of sortedRuns) { const cnt = bricksForRun(r.sec, unitSec); for (let i = 0; i < cnt; i++) brickList.push({ run: r, k: r.id + '_' + (n++) }); }
    } else {
      brickList = sortedRuns.map(r => ({ run: r, k: String(r.id) }));
    }
    build = { classified, unclassified, unitSec, rows: buildPyramidRows(brickList, cols, it => it.run.zone) };
  } catch (e) {
    return html`<div class="pyr-empty">The pyramid couldn't be built from the current data — your runs are safe in the Log.</div>`;
  }
  const { classified, unclassified, unitSec, rows } = build;
  const totDist = classified.reduce((a, l) => a + l.km, 0);
  const totSec = classified.reduce((a, l) => a + l.sec, 0);
  const zonesPresent = ZONE_ORDER.filter(zk => classified.some(b => b.zone === zk));
  const assess = assessDistribution(classified);
  let prevAssess = null, insights = [];
  try {
    const prevWin = filterPriorWindow(dedupeRuns(logs), days, todayStr());
    const prevClassified = [];
    for (const l of prevWin) { if (!isRun(l)) continue; const cls = classifyLog(l); if (cls) prevClassified.push({ ...l, zone: cls.zone, band: cls.band }); }
    prevAssess = assessDistribution(prevClassified);
    insights = buildInsights({ classified, assess, prevAssess, rangeLabel, unclassifiedCount: unclassified.length }, dateStr);
  } catch (e) { insights = []; }
  const active = (hovId || selId) ? classified.find(b => b.id === (hovId || selId)) : null;
  const labelColor = { pyramid: '#3f7a52', low: '#4f8f6a', middle: '#c0872e', top: '#b5473a', none: 'var(--muted)' }[assess.key];
  const labelBg = { pyramid: 'var(--greensoft)', low: 'var(--greensoft)', middle: 'var(--goldsoft)', top: '#f3ddd8', none: 'var(--card2)' }[assess.key];
  const sentence = { pyramid: 'This currently forms a descending pyramidal distribution.', low: 'Easy running is the largest share, without a clear descending step down through moderate and high.', middle: 'Moderate-intensity running is the largest share in this period.', top: 'High-intensity running is the largest share in this period.', none: "There isn't enough logged running in this period to describe a distribution yet." }[assess.key];

  return html`<div class="pyr">
    <div class="pyr-range" role="group" aria-label="Date range">
      ${[[7, '7d'], [28, '28d'], [42, '6wk'], [84, '12wk']].map(([d, l]) => html`<button class=${'rpill' + (days === d ? ' on' : '')} aria-pressed=${days === d} onClick=${() => setDays(d)}>${l}</button>`)}
    </div>
    <div class="seg" style="margin:0 0 12px" role="group" aria-label="Weight the pyramid by">
      <button class=${mode === 'time' ? 'on' : ''} aria-pressed=${mode === 'time'} onClick=${() => setMode('time')}>By time</button>
      <button class=${mode === 'sessions' ? 'on' : ''} aria-pressed=${mode === 'sessions'} onClick=${() => setMode('sessions')}>By session</button>
    </div>
    ${classified.length === 0 ? html`<div class="pyr-empty">
        ${unclassified.length ? `No classified runs in the last ${rangeLabel}. ${unclassified.length} run${unclassified.length > 1 ? 's' : ''} couldn't be given a zone.` : `No runs logged in the last ${rangeLabel}. Log a run or connect Strava to build your pyramid.`}
      </div>` : html`<div>
      <div class="pyr-stats">
        <div class="ptile"><b>${classified.length}</b><span>Sessions</span></div>
        <div class="ptile"><b>${unit === 'mi' ? (totDist / MI).toFixed(1) : totDist.toFixed(1)} ${unit}</b><span>Shown</span></div>
        <div class="ptile"><b>${fmtDur(totSec)}</b><span>Time</span></div>
      </div>
      <div class="zlegend" role="group" aria-label="Filter by zone">
        <button class=${'zchip all' + (filterZone === null ? ' on' : '')} aria-pressed=${filterZone === null} onClick=${() => setFilterZone(null)}>All</button>
        ${zonesPresent.map(zk => html`<button class=${'zchip' + (filterZone === zk ? ' on' : '')} aria-pressed=${filterZone === zk} onClick=${() => setFilterZone(filterZone === zk ? null : zk)}>
          <span class="sw" style=${'background:' + ZMETA[zk].dot}></span>${ZMETA[zk].label}</button>`)}
      </div>
      <div class="pyr-rows">
        ${rows.slice().reverse().map(row => html`<div class="pyr-row">
          ${row.map(it => {
    const b = it.run, c = ZMETA[b.zone].dot, dim = filterZone && filterZone !== b.zone, sel = selId === b.id;
    return html`<button key=${it.k} class=${'brick' + (dim ? ' dim' : '') + (sel ? ' sel' : '')}
              style=${`background:linear-gradient(180deg, ${shade(c, 28)}, ${shade(c, -18)})`}
              aria-label=${`${ZMETA[b.zone].label} session · ${dateStr(b.date)} · ${dispDist(b.km)} · ${fmtClock(b.sec)}`} aria-pressed=${sel}
              onClick=${() => setSelId(sel ? null : b.id)}
              onMouseEnter=${() => setHovId(b.id)} onMouseLeave=${() => setHovId(null)}
              onFocus=${() => setHovId(b.id)} onBlur=${() => setHovId(null)}><span class="bc">${ZONE_ABBR[b.zone]}</span></button>`;
  })}
        </div>`)}
      </div>
      <p class="dim" style="font-size:11.5px;margin:2px 2px 0">${mode === 'time' ? `Weighted by time — each brick ≈ ${Math.round((unitSec || 900) / 60)} min. Long runs stack taller.` : 'One brick per session. Switch to “By time” to weight by duration.'}</p>
      ${active ? html`<div class="pyr-detail">
        <div class="row" style="margin-bottom:4px">
          <span class="lbl" style="color:var(--gold)">${ZMETA[active.zone].label} · ${BAND_META[active.band].label} intensity</span>
          <span class="lbl">${dateStr(active.date)}</span>
        </div>
        <div class="serif" style="font-size:21px;font-weight:600">${ZMETA[active.zone].label} · ${fmtClock(active.sec)}</div>
        <div class="m" style="color:var(--muted);font-size:12.5px;margin-top:3px">${dispDist(active.km)} · ${paceStr(active.sec / active.km, unit)}${active.hr ? ` · ${active.hr} bpm avg` : ''}${active.src === 'strava' ? ' · Strava' : ''}</div>
        ${active.notes ? html`<p style="margin:10px 0 0;font-size:13.5px;line-height:1.5">${active.notes}</p>` : ''}
        <div style="margin-top:12px">
          ${active.src === 'strava'
      ? html`<a class="btn ghost sm" href=${'https://www.strava.com/activities/' + String(active.id).replace('strava-', '')} target="_blank" rel="noopener">Open in Strava →</a>`
      : html`<button class="btn ghost sm" onClick=${() => setTab('log')}>Open in Log →</button>`}
        </div>
      </div>` : html`<p class="dim" style="font-size:12px;margin:8px 2px 2px">Tap a brick for the session. Easiest sits at the base, hardest at the top.</p>`}
      ${unclassified.length ? html`<div class="pyr-uncl">＋ ${unclassified.length} unclassified run${unclassified.length > 1 ? 's' : ''} in this period — kept in the Log but out of the pyramid and the distribution below.</div>` : ''}

      <div class="row" style="margin:20px 2px 2px">
        <div class="lbl" style="color:var(--gold)">Training distribution</div>
        <button class="infobtn" aria-label="What this measures" aria-expanded=${showInfo} onClick=${() => setShowInfo(v => !v)}>i</button>
      </div>
      ${showInfo ? html`<div class="infonote">The pyramid shows each session by its classification — one brick per run. This distribution is measured differently: from accumulated <b>time</b> in each intensity band, so a long easy run counts for more than a short one. It describes what you've logged; it isn't a target or a judgement.</div>` : html`<div style="height:8px"></div>`}
      ${assess.enough ? html`<div>
        <div class="dist-bar" role="img" aria-label=${`${assess.pct.low} percent low, ${assess.pct.moderate} percent moderate, ${assess.pct.high} percent high intensity`}>
          ${['low', 'moderate', 'high'].map(bnd => assess.t[bnd] > 0 ? html`<i style=${`width:${assess.t[bnd] / assess.total * 100}%;background:${BAND_META[bnd].color}`}></i>` : '')}
        </div>
        <span class="distlabel" style=${`background:${labelBg};color:${labelColor}`}>${assess.label}</span>
        <div style="margin-top:12px">
          ${['low', 'moderate', 'high'].map(bnd => html`<div class="drow">
            <span class="dk"><span class="sw" style=${'background:' + BAND_META[bnd].color}></span>${BAND_META[bnd].label} intensity</span>
            <span><b>${assess.pct[bnd]}%</b> <span class="dim" style="font-size:12px">· ${fmtDur(assess.t[bnd])} · ${assess.n[bnd]} run${assess.n[bnd] === 1 ? '' : 's'}</span></span>
          </div>`)}
        </div>
        <p style="margin:12px 2px 2px;font-size:13px;line-height:1.55;color:var(--muted)">Your last ${rangeLabel} contain ${assess.pct.low}% low, ${assess.pct.moderate}% moderate and ${assess.pct.high}% high-intensity running. ${sentence}</p>
        ${insights.length ? html`<div class="card" style="margin-top:14px">
          <div class="lbl" style="color:var(--gold);margin-bottom:8px">Auto Analysis</div>
          ${insights.map(line => html`<p style="margin:0 0 8px;font-size:13.5px;line-height:1.55">${line}</p>`)}
          <p class="dim" style="margin:6px 0 0;font-size:11px">Generated from this period's logged data. Descriptive only — not coaching or medical advice.</p>
        </div>` : ''}
      </div>` : html`<div class="pyr-empty">Not enough training in the last ${rangeLabel} to describe a distribution yet.</div>`}
    </div>`}
  </div>`;
}

/* ---------------- Log view ---------------- */
function weekIndexOfDate(dstr) { return Math.floor(Math.round((ymd(dstr) - ymd(PLAN_START)) / 86400000) / 7) + 1; }
function todayStr() { const n = window.__TODAY__ ? new Date(window.__TODAY__) : new Date(); return `${n.getFullYear()}-${pad(n.getMonth() + 1)}-${pad(n.getDate())}`; }

function LogView({ logs, setLogs, unit, prefill, clearPrefill, toast }) {
  const blank = () => ({ date: todayStr(), type: 'aerobic', dist: '', time: '', notes: '' });
  const [f, setF] = useState(blank());
  useEffect(() => { if (prefill) { setF({ date: prefill.date, type: prefill.type, dist: prefill.dist ? String(unit === 'mi' ? +(prefill.dist / MI).toFixed(2) : prefill.dist) : '', time: '', notes: '' }); clearPrefill(); } }, [prefill]);
  const set = (k, v) => setF(o => ({ ...o, [k]: v }));
  const distKm = f.dist ? (unit === 'mi' ? parseFloat(f.dist) * MI : parseFloat(f.dist)) : null;
  const sec = parseTime(f.time);
  const pacePreview = distKm && sec ? paceStr(sec / distKm, unit) : '—';
  function save() {
    if (!distKm || !sec) { toast('Add distance and time'); return; }
    const item = { id: Date.now(), date: f.date, type: f.type, km: +distKm.toFixed(3), sec, notes: f.notes.trim() };
    setLogs([item, ...logs].sort((a, b) => (a.date < b.date ? 1 : -1)));
    setF(blank()); toast('Run logged ✓');
  }
  const dispDist = km => (unit === 'mi' ? (km / MI).toFixed(2) + ' mi' : km.toFixed(1) + ' km');
  const curWk = weekIndexOfDate(todayStr());
  const wkLogs = logs.filter(l => weekIndexOfDate(l.date) === curWk);
  const wkKm = wkLogs.reduce((a, l) => a + l.km, 0);
  const wkTarget = VOL[curWk];
  return html`<div>
    <div class="section-t">Log a Run</div>
    <div class="card">
      <div class="two">
        <label class="field"><span class="lbl">Date</span><input type="date" value=${f.date} onChange=${e => set('date', e.target.value)}/></label>
        <label class="field"><span class="lbl">Session</span>
          <select value=${f.type} onChange=${e => set('type', e.target.value)}>
            ${Object.keys(TYPE_LABEL).filter(k => k !== 'rest').map(k => html`<option value=${k}>${TYPE_LABEL[k]}</option>`)}
          </select></label>
      </div>
      <div class="two">
        <label class="field"><span class="lbl">Distance (${unit})</span><input inputmode="decimal" placeholder=${unit === 'mi' ? 'e.g. 6.2' : 'e.g. 10'} value=${f.dist} onInput=${e => set('dist', e.target.value)}/></label>
        <label class="field"><span class="lbl">Time (h:mm:ss)</span><input inputmode="numeric" placeholder="e.g. 48:30" value=${f.time} onInput=${e => set('time', e.target.value)}/></label>
      </div>
      <div class="row" style="margin:-2px 2px 10px"><span class="lbl">Pace</span><span class="serif" style="font-size:18px">${pacePreview}</span></div>
      <label class="field"><span class="lbl">Notes</span><textarea placeholder="How did it feel? Fuelling, weather, splits…" value=${f.notes} onChange=${e => set('notes', e.target.value)}></textarea></label>
      <button class="btn" onClick=${save}>Save run</button>
    </div>

    <div class="section-t">This Week</div>
    <div class="card"><div class="stat">
      <div><div class="b serif">${unit === 'mi' ? (wkKm / MI).toFixed(1) : wkKm.toFixed(1)}</div><div class="lbl">${unit} logged</div></div>
      <div><div class="b serif">${wkTarget == null ? 'Race' : wkTarget}</div><div class="lbl">week target</div></div>
      <div><div class="b serif">${wkLogs.length}</div><div class="lbl">runs</div></div>
    </div></div>

    <div class="section-t">History ${logs.length ? '(' + logs.length + ')' : ''}</div>
    ${logs.length === 0 && html`<p class="dim" style="margin:2px">No runs logged yet. Your log is saved on this device.</p>`}
    ${logs.length > 0 && html`<div class="card">
      ${logs.map(l => html`<div class="logitem">
        <div style="flex:1">
          <div style="font-weight:600">${dispDist(l.km)} · ${fmtClock(l.sec)} <span class="pill-mini">${TYPE_LABEL[l.type] || l.type}</span></div>
          <div class="m" style="color:var(--muted);font-size:12.5px">${fmtDate(new Date(ymd(l.date)))} · ${paceStr(l.sec / l.km, unit)}${l.notes ? ' · ' + l.notes : ''}</div>
        </div>
        <button class="del" title="Delete" onClick=${() => setLogs(logs.filter(x => x.id !== l.id))}>×</button>
      </div>`)}
    </div>`}
    <div class="sr-gap"></div>
  </div>`;
}

      <div class="two">
        <button class="btn ghost sm" onClick=${exportData}>⬇ Export backup</button>
        <button class="btn ghost sm" onClick=${() => fileRef.current && fileRef.current.click()}>⬆ Import</button>
      </div>
      <input ref=${fileRef} type="file" accept="application/json" style="display:none" onChange=${e => { const fl = e.target.files[0]; if (fl) importData(fl); e.target.value = ''; }}/>
      <button class="btn ghost sm" style="margin-top:10px;color:#b5473a" onClick=${() => { if (confirm('Erase all logs and settings on this device?')) resetAll(); }}>Reset everything</button>
    </div>
    <p class="dim" style="text-align:center;font-size:12px;margin:14px 2px 4px">Tip: add to your Home Screen for offline use and the most reliable saving.</p>
    <div class="sr-gap"></div>
  </div>`;
}

/* ---------------- Strava sync ---------------- */
const STRAVA_CLIENT_ID = '273574';
const STRAVA_RELAY = 'https://strava-relay.pauldonnelly2001.workers.dev';
const STRAVA_SCOPE = 'activity:read_all';
const stravaRedirect = () => location.origin + location.pathname;
function stravaAuthUrl() {
  const p = new URLSearchParams({ client_id: STRAVA_CLIENT_ID, response_type: 'code', redirect_uri: stravaRedirect(), approval_prompt: 'auto', scope: STRAVA_SCOPE });
  return 'https://www.strava.com/oauth/authorize?' + p.toString();
}
async function stravaPost(path, body) {
  const r = await fetch(STRAVA_RELAY + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.error || (j.errors && j.errors.length)) throw new Error(j.message || j.error || 'Strava error');
  return j;
}
async function stravaActivities(token, afterEpoch) {
  let all = [];
  for (let page = 1; page <= 5; page++) {
    const r = await fetch(STRAVA_RELAY + '/activities?after=' + afterEpoch + '&per_page=100&page=' + page, { headers: { Authorization: 'Bearer ' + token } });
    const arr = await r.json().catch(() => null);
    if (!Array.isArray(arr) || arr.length === 0) break;
    all = all.concat(arr);
    if (arr.length < 100) break;
  }
  return all;
}
const RUN_TYPE_BY_DOW = ['recovery', 'threshold', 'aerobic', 'hills', 'rest', 'marathon', 'long'];
function plannedType(dstr) { const t = RUN_TYPE_BY_DOW[(new Date(ymd(dstr)).getUTCDay() + 6) % 7]; return t === 'rest' ? 'aerobic' : t; }
function timeAgo(ms) { if (!ms) return ''; const s = Math.floor((Date.now() - ms) / 1000); if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + 'm ago'; if (s < 86400) return Math.floor(s / 3600) + 'h ago'; return Math.floor(s / 86400) + 'd ago'; }

/* ---------------- calendar export (.ics) ---------------- */
function icsEsc(str) { return String(str == null ? '' : str).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n'); }
function icsDateStamp(d) { return `${d.getUTCFullYear()}${pad(d.getUTCMonth() + 1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}${pad(d.getUTCSeconds())}Z`; }
function buildICS() {
  const now = window.__TODAY__ ? new Date(window.__TODAY__) : new Date();
  const stamp = icsDateStamp(now);
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//3.09 Marathon Trainer//Valencia 2026//EN', 'CALSCALE:GREGORIAN'];
  for (let idx = 0; idx <= 111; idx++) {
    const w = Math.floor(idx / 7) + 1, dow = idx % 7;
    const s = buildDay(w, dow);
    if (s.type === 'rest') continue;
    const dt = dateOfIndex(idx);
    const ds = `${dt.getUTCFullYear()}${pad(dt.getUTCMonth() + 1)}${pad(dt.getUTCDate())}`;
    const nd = new Date(dt.getTime() + 86400000);
    const de = `${nd.getUTCFullYear()}${pad(nd.getUTCMonth() + 1)}${pad(nd.getUTCDate())}`;
    lines.push('BEGIN:VEVENT', `UID:mtp-${ds}-${idx}@marathon-trainer`, `DTSTAMP:${stamp}`,
      `DTSTART;VALUE=DATE:${ds}`, `DTEND;VALUE=DATE:${de}`,
      `SUMMARY:${icsEsc(`${s.title} — ${s.volume}`)}`, `DESCRIPTION:${icsEsc(s.spec || '')}`, 'END:VEVENT');
  }
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}
function downloadICS() {
  const blob = new Blob([buildICS()], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'valencia-marathon-plan.ics'; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/* ---------------- App root ---------------- */
const DEF_SETTINGS = { unit: 'km', theme: 'system', curDist: 'full', curTime: '3:26:00', goalTime: '3:10:00', kg: null };
const DEF_VIDEOS = { recovery: '', threshold: '', aerobic: '', hills: '', marathon: '', long: '', rest: '' };
const YT = id => 'https://www.youtube.com/watch?v=' + id;
const CURATED_VIDEOS = {
  recovery: ['yjB23ki0HHE', 'UQltlMDoh1Q', 'iqH4HsSNY_Q'].map(YT),
  threshold: ['Jpd2XtGX8wo', 'lPXdra-X1DE', '67ylr5oCNBk', 'a48FA3YwShM'].map(YT),
  aerobic: ['XhBPB1Hxsp4', 'T5M5NHPt3wY', 'sdCIir5rrzQ'].map(YT),
  hills: ['170kvQ04IVo', 'Cie5htX3T0o', 'H3yJ8d4aEf4'].map(YT),
  marathon: ['YKYd0ch8x38', 'VRimgg7hc1k', 'Q5faozr-mWM'].map(YT),
  long: ['hXoiKl8RFRI', 'UsQX0tK8HHo', 'p8qSHEDRir8'].map(YT),
  rest: ['O7PNhV-CMJ4', 'tBlN2ZsjLeM', 'Sew5C70DhDQ'].map(YT)
};

function App() {
  const [settings, setSettings] = usePersistent('mtp:settings', DEF_SETTINGS, true);
  const [videos, setVideos] = usePersistent('mtp:videos', DEF_VIDEOS, true);
  const [logs, setLogs] = usePersistent('mtp:logs', []);
  const [tab, setTab] = useState('today');
  const [view, setView] = useState(() => Math.min(111, Math.max(0, todayIndex())));
  const [prefill, setPrefill] = useState(null);
  const [toastMsg, setToastMsg] = useState(null);
  const toast = (m) => { setToastMsg(m); clearTimeout(window.__tt); window.__tt = setTimeout(() => setToastMsg(null), 1800); };

  // Strava
  const [strava, setStrava] = usePersistent('mtp:strava', null);
  const [checkins, setCheckins] = usePersistent('mtp:checkin', {}, true);
  const [ciOpen, setCiOpen] = useState(false);
  const [ciAuto, setCiAuto] = useState(false);
  const [stravaBusy, setStravaBusy] = useState(false);
  async function doSync(rec0) {
    let rec = rec0 || strava;
    if (!rec) { toast('Connect Strava first'); return; }
    setStravaBusy(true);
    try {
      const now = Math.floor(Date.now() / 1000);
      if (!rec.expires_at || rec.expires_at <= now + 60) {
        const t = await stravaPost('/refresh', { refresh_token: rec.refresh_token });
        rec = { ...rec, access_token: t.access_token, refresh_token: t.refresh_token, expires_at: t.expires_at };
      }
      const after = Math.floor(ymd(PLAN_START) / 1000) - 86400;
      const acts = await stravaActivities(rec.access_token, after);
      const runs = acts.filter(a => /run/i.test(a.sport_type || a.type || ''));
      let added = 0;
      setLogs(prev => {
        const seen = new Set(prev.map(l => String(l.id)));
        const mk = runs.filter(a => !seen.has('strava-' + a.id)).map(a => {
          const date = (a.start_date_local || a.start_date || '').slice(0, 10);
          return { id: 'strava-' + a.id, date, type: plannedType(date || todayStr()), km: +((a.distance || 0) / 1000).toFixed(3), sec: Math.round(a.moving_time || a.elapsed_time || 0), notes: a.name || 'Strava run', src: 'strava' };
        }).filter(x => x.km > 0 && x.sec > 0 && x.date);
        added = mk.length;
        return [...mk, ...prev].sort((a, b) => (a.date < b.date ? 1 : -1));
      });
      setStrava({ ...rec, lastSync: Date.now() });
      toast(added ? ('Synced ' + added + ' new run' + (added > 1 ? 's' : '') + ' ✓') : 'Strava up to date');
    } catch (e) { toast('Strava sync failed — try again'); }
    finally { setStravaBusy(false); }
  }
  const connectStrava = () => { location.href = stravaAuthUrl(); };
  const disconnectStrava = () => { setStrava(null); toast('Strava disconnected'); };
  useEffect(() => {
    const q = new URLSearchParams(location.search);
    if (q.get('error')) { history.replaceState(null, '', location.pathname); toast('Strava connection cancelled'); return; }
    const code = q.get('code');
    if (code && q.get('scope')) {
      setStravaBusy(true);
      stravaPost('/exchange', { code }).then(async tk => {
        if (tk && tk.access_token) {
          const rec = { access_token: tk.access_token, refresh_token: tk.refresh_token, expires_at: tk.expires_at, athlete: tk.athlete || null, lastSync: 0 };
          setStrava(rec);
          history.replaceState(null, '', location.pathname);
          toast('Strava connected ✓');
          await doSync(rec);
        } else { setStravaBusy(false); toast('Strava connect failed'); }
      }).catch(() => { setStravaBusy(false); toast('Strava connect failed'); });
    }
  }, []);

  // theme
  useEffect(() => {
    const mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
    const apply = () => {
      const dark = settings.theme === 'dark' || (settings.theme === 'system' && mq && mq.matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      const tc = document.querySelector('meta[name=theme-color]'); if (tc) tc.setAttribute('content', dark ? '#16140f' : '#f2ecdf');
    };
    apply();
    if (mq && settings.theme === 'system') { mq.addEventListener && mq.addEventListener('change', apply); return () => mq.removeEventListener && mq.removeEventListener('change', apply); }
  }, [settings.theme]);

  // paces
  const { z, goalMP } = useMemo(() => {
    const curSec = marathonEquivSec(DIST[settings.curDist] || MAR, parseTime(settings.curTime) || 3 * 3600 + 26 * 60);
    const zz = zonesFrom(curSec); zz._cur = curSec;
    const goalSec = parseTime(settings.goalTime) || (3 * 3600 + 10 * 60);
    return { z: zz, goalMP: goalSec / MAR };
  }, [settings.curDist, settings.curTime, settings.goalTime]);

  function onLog(session, idx) {
    setPrefill({ date: dateStrOfIndex(idx), type: session.type === 'recovery' ? 'recovery' : session.type, dist: session.km || '' });
    setTab('log');
  }
  const todayKey = dateStrOfIndex(Math.min(111, Math.max(0, todayIndex())));
  const todayEntry = checkins[todayKey] || null;
  useEffect(() => {
    if (ciAuto) return;
    const t = setTimeout(() => {
      setCiAuto(true);
      const i = todayIndex();
      if (i < 0 || i > 111) return;
      if (!checkins[todayKey]) setCiOpen(true);
    }, 450);
    return () => clearTimeout(t);
  }, [checkins, todayKey]);
  function saveCheckIn(data) {
    setCheckins({ ...checkins, [todayKey]: { ...data, ts: new Date().toISOString() } });
    setCiOpen(false);
    toast(data.accepted ? 'Session adjusted' : 'Check-in logged');
  }
  function undoAdjust() {
    const e = checkins[todayKey];
    if (!e) return;
    setCheckins({ ...checkins, [todayKey]: { ...e, accepted: false } });
    toast('Back to the plan as written');
  }
  function setKg(v) { setSettings({ ...settings, kg: v }); }

  function exportData() {
    const blob = new Blob([JSON.stringify({ app: 'marathon-trainer', version: 1, exported: new Date().toISOString(), settings, videos, logs, checkins }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'marathon-trainer-backup.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast('Backup downloaded');
  }
  function importData(file) {
    const r = new FileReader();
    r.onload = () => { try { const d = JSON.parse(r.result); if (d.settings) setSettings({ ...DEF_SETTINGS, ...d.settings }); if (d.videos) setVideos({ ...DEF_VIDEOS, ...d.videos }); if (Array.isArray(d.logs)) setLogs(d.logs); if (d.checkins && typeof d.checkins === 'object') setCheckins(d.checkins); toast('Backup imported ✓'); } catch (e) { toast('Could not read that file'); } };
    r.readAsText(file);
  }
  function resetAll() { setSettings(DEF_SETTINGS); setVideos(DEF_VIDEOS); setLogs([]); setCheckins({}); toast('Reset done'); }

  const unit = settings.unit;
  const cur = z._cur, goal = parseTime(settings.goalTime) || (3 * 3600 + 10 * 60);
  return html`<div class="app">
    <div class="hdr">
      <div class="mark"><div class="logo serif">26</div><div><div class="htxt">Valencia Marathon</div><div class="hsub">Sub-3:10 · 16-week block</div></div></div>
      <div class="count"><b>${Math.max(0, Math.round((ymd(RACE_DATE) - ymd(todayStr())) / 86400000))}</b><span>days to go</span></div>
    </div>
    ${tab === 'today' && html`<${TodayView} view=${view} setView=${setView} settings=${settings} z=${z} goalMP=${goalMP} unit=${unit} videos=${videos} setVideos=${setVideos} onLog=${onLog} entry=${todayEntry} onCheckIn=${() => setCiOpen(true)} onUndo=${undoAdjust} kg=${settings.kg} setKg=${setKg}/>`}
    ${tab === 'plan' && html`<${PlanView} setView=${setView} setTab=${setTab}/>`}
    ${tab === 'zones' && html`<${ZonesView} z=${z} unit=${unit} goalMP=${goalMP} cur=${cur} goal=${goal} setTab=${setTab} logs=${logs}/>`}
    ${tab === 'log' && html`<${LogView} logs=${logs} setLogs=${setLogs} unit=${unit} prefill=${prefill} clearPrefill=${() => setPrefill(null)} toast=${toast}/>`}
    ${tab === 'settings' && html`<${SettingsView} settings=${settings} setSettings=${setSettings} z=${z} goalMP=${goalMP} exportData=${exportData} importData=${importData} resetAll=${resetAll} toast=${toast} strava=${strava} stravaBusy=${stravaBusy} onConnect=${connectStrava} onSync=${() => doSync()} onDisconnect=${disconnectStrava}/>`}

    ${ciOpen && (() => { const i = Math.min(111, Math.max(0, todayIndex())); const cs = buildDay(Math.floor(i / 7) + 1, ((i % 7) + 7) % 7);
      return html`<${CheckInSheet} s=${cs} z=${z} kg=${settings.kg} idx=${i} setKg=${setKg} onSave=${saveCheckIn} onSkip=${() => { setCiOpen(false); }}/>`; })()}

    ${toastMsg && html`<div class="toast">${toastMsg}</div>`}
    <div class="tabbar">
      ${[['today', 'Today'], ['plan', 'Plan'], ['zones', 'Zones'], ['log', 'Log'], ['settings', 'Settings']].map(([k, l]) =>
        html`<button class=${'tab' + (tab === k ? ' on' : '')} onClick=${() => setTab(k)}><${TabIcon} n=${k}/>${l}</button>`)}
    </div>
  </div>`;
}

render(html`<${App}/>`, document.getElementById('root'));
</script>
