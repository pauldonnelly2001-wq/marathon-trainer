<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="theme-color" content="#f2ecdf"/>
<meta name="apple-mobile-web-app-title" content="3.09"/>
<meta name="application-name" content="3.09"/>
<meta name="mobile-web-app-capable" content="yes"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"/>
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png"/>
<link rel="manifest" href="manifest.webmanifest"/>
<title>Marathon Trainer — Valencia 2026</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f2ecdf; --bg2:#ece4d3; --card:#fbf9f2; --card2:#f4eede; --ink:#211d16; --muted:#8c8371;
  --line:#e6ddc9; --gold:#997522; --gold2:#b98f37; --goldsoft:#efe6ce; --green:#3f7a52; --greensoft:#e2ecdd;
  --shadow:0 1px 2px rgba(40,32,10,.05),0 6px 18px rgba(40,32,10,.05); --radius:16px;
}
[data-theme="dark"]{
  --bg:#16140f; --bg2:#1d1a13; --card:#211e17; --card2:#26221a; --ink:#f1ebdd; --muted:#a39a86;
  --line:#332e23; --gold:#cBA35a; --gold2:#d8b466; --goldsoft:#302913; --green:#7cb791; --greensoft:#22301f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35);
}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;font-size:16px;line-height:1.45}
.serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
/* header */
.hdr{position:sticky;top:0;z-index:20;background:var(--bg);padding:14px 2px 10px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--line);margin:0 -16px 14px;padding-left:16px;padding-right:16px}
.hdr .mark{display:flex;align-items:center;gap:9px}
.hdr .logo{width:26px;height:26px;border-radius:7px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:13px;font-weight:700;letter-spacing:-.5px}
.hdr .htxt{font-size:12.5px;font-weight:650;letter-spacing:.02em}
.hdr .hsub{font-size:11px;color:var(--muted)}
.count{text-align:right}
.count b{color:var(--gold);font-size:15px}
.count span{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
/* labels + text */
.lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.dim{color:var(--muted)}
h1,h2,h3{margin:0}
.title{font-size:30px;line-height:1.08;font-weight:600;letter-spacing:-.01em}
.section-t{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);font-weight:700;margin:22px 2px 10px}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.card.pace{background:var(--card2)}
.card.sess{border-left:4px solid var(--gold);padding-left:18px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.kv{padding:11px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.kv .lbl{display:block;margin-bottom:3px}
.kv .v{font-size:16px;font-weight:600}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  padding:4px 10px;border-radius:999px;background:var(--greensoft);color:var(--green)}
.badge.strong{background:var(--goldsoft);color:var(--gold)}
.badge.controlled{background:#e9e3f0;color:#6b5ca0}
[data-theme="dark"] .badge.controlled{background:#241f2e;color:#a99cd6}
.badge.rest{background:var(--bg2);color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
/* big pace */
.pace-big{font-size:38px;font-weight:600;letter-spacing:-.02em;margin:2px 0}
.pace-sub{font-size:12.5px;color:var(--muted)}
/* day pills */
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px;margin:0 -2px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;padding:9px 15px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.pill.on{border-color:var(--gold);color:var(--gold);background:var(--goldsoft)}
.pill.rest{font-style:italic}
/* buttons */
button{font-family:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:12px;
  background:var(--ink);color:var(--bg);font-size:16px;font-weight:650;padding:14px;box-shadow:var(--shadow)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.sm{width:auto;padding:9px 14px;font-size:14px;border-radius:10px}
.iconbtn{width:38px;height:38px;border-radius:10px;background:var(--ink);color:var(--bg);border:0;display:grid;place-items:center;font-size:17px}
.iconbtn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.iconbtn:disabled{opacity:.35}
/* nav arrows in today */
.navrow{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:6px}
/* collapsible */
.acc{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);margin-bottom:12px}
.acc .head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;font-weight:600;cursor:pointer}
.acc .body{padding:0 16px 14px}
.acc .chev{color:var(--muted);transition:transform .18s}
.acc.open .chev{transform:rotate(180deg)}
.oea .lbl{margin-top:12px;display:block;margin-bottom:3px}
.oea p{margin:0}
.note{background:var(--card2);border-left:3px solid var(--gold);border-radius:0 12px 12px 0;padding:14px 16px;margin-bottom:12px}
.note .lbl{color:var(--gold);margin-bottom:6px;display:block}
.note p{margin:0;font-style:italic;color:var(--ink);opacity:.9}
/* forms */
label.field{display:block;margin-bottom:12px}
label.field .lbl{margin-bottom:6px;display:block}
input,select,textarea{width:100%;font-family:inherit;font-size:16px;color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:11px;padding:12px 13px}
input:focus,select,textarea:focus{outline:2px solid var(--goldsoft)}
textarea{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
/* segmented */
.seg{display:flex;background:var(--bg2);border-radius:11px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font-weight:650;font-size:13.5px;padding:9px 6px;border-radius:8px}
.seg button.on{background:var(--ink);color:var(--bg);box-shadow:var(--shadow)}
/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));max-width:480px;margin:0 auto}
.tab{flex:1;background:0;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;padding:4px 0}
.tab.on{color:var(--gold)}
.tab svg{width:22px;height:22px}
/* plan list */
.wk{border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:10px;overflow:hidden}
.wk .head{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;cursor:pointer;gap:10px}
.wk.cur{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.phase-tag{font-size:10px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--goldsoft);color:var(--gold)}
.dayline{display:flex;justify-content:space-between;gap:10px;padding:10px 15px;border-top:1px solid var(--line);cursor:pointer}
.dayline:hover{background:var(--card2)}
.dayline .d{font-weight:600;min-width:34px;color:var(--muted)}
.dayline .t{flex:1}
.dayline .m{font-size:12px;color:var(--muted)}
/* log items */
.logitem{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.logitem:first-child{border-top:0}
.logitem .del{color:var(--muted);background:0;border:0;font-size:18px;padding:0 4px}
.pill-mini{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:6px;background:var(--card2);color:var(--muted)}
.stat{display:flex;gap:14px;flex-wrap:wrap}
.stat .b{font-size:22px;font-weight:600}
.embed{position:relative;padding-bottom:56.25%;height:0;border-radius:12px;overflow:hidden;margin-top:6px;background:var(--bg2)}
.embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.hintbar{font-size:12px;color:var(--muted);background:var(--card2);border-radius:10px;padding:9px 12px;margin-top:6px}
.link{color:var(--gold);font-weight:600;text-decoration:none}
.sr-gap{height:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));z-index:50;
  background:var(--green);color:#fff;padding:11px 18px;border-radius:999px;font-weight:650;font-size:14px;box-shadow:var(--shadow)}
.chip{display:inline-block;font-size:11px;font-weight:600;color:var(--muted);background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;margin:0 6px 6px 0}
</style>
</head>

<div id="root"></div>

      const isOpen = open === w;
      return html`<div class=${'wk' + (w === cur ? ' cur' : '')}>
        <div class="head" onClick=${() => setOpen(isOpen ? 0 : w)}>
          <div>
            <div style="font-weight:650">Week ${w}${w === cur ? ' · Now' : ''}</div>
            <div class="m" style="font-size:12px;color:var(--muted)">${VOL[w] == null ? 'Race week' : VOL[w] + ' km target'}</div>
          </div>
          <span class="phase-tag">${phaseOf(w)}</span>
        </div>
        ${isOpen && [0, 1, 2, 3, 4, 5, 6].map(dow => {
          const s = buildDay(w, dow);
          return html`<div class="dayline" onClick=${() => { setView((w - 1) * 7 + dow); setTab('today'); }}>
            <span class="d">${s.day}</span>
            <span class="t"><div style="font-weight:600">${s.title}</div><div class="m">${s.type === 'rest' ? 'Rest day' : s.spec}</div></span>
            <span class="m" style="white-space:nowrap">${s.volume}</span>
          </div>`;
        })}
      </div>`;
    })}
    <div class="sr-gap"></div>
  </div>`;
}

/* ---------------- Zones view ---------------- */
function ZonesView({ z, unit, goalMP, cur, goal, setTab }) {
  const rows = ZONE_ORDER.map(k => {
    const meta = ZMETA[k];
    const pace = k === 'hill' ? 'Effort' : paceForZone(z, k, unit);
    return html`<div class="card" style="padding:14px 16px">
      <div class="row">
        <div style="display:flex;gap:11px;align-items:flex-start">
          <span class="dot" style=${'background:' + meta.dot + ';margin-top:6px'}></span>
          <div><div style="font-weight:650">${meta.label}</div><div class="m" style="font-size:12.5px;color:var(--muted)">${meta.desc}</div></div>
        </div>
        <div class="serif" style="font-size:19px;font-weight:600;white-space:nowrap">${pace}</div>
      </div>
    </div>`;
  });
  return html`<div>
    <div class="section-t">Your Pace Zones</div>
    <p class="dim" style="margin:0 2px 14px;font-size:13.5px">Calculated live from your current fitness. Update it in Settings and every pace here recalculates.</p>
    ${rows}
    <div class="section-t">References</div>
    <div class="card pace"><div class="row"><div><div style="font-weight:650">Current fitness</div><div class="m" style="color:var(--muted);font-size:12.5px">${fmtClock(cur)} marathon-equivalent</div></div><div class="serif" style="font-size:20px">${paceStr(z.MP, unit)}</div></div></div>
    <div class="card pace"><div class="row"><div><div style="font-weight:650">Goal pace</div><div class="m" style="color:var(--muted);font-size:12.5px">${fmtClock(goal)} target</div></div><div class="serif" style="font-size:20px">${paceStr(goalMP, unit)}</div></div></div>
    <div class="card pace"><div class="row"><div><div style="font-weight:650">Gap to close</div><div class="m" style="color:var(--muted);font-size:12.5px">Current → goal marathon pace</div></div><div class="serif" style="font-size:20px">${Math.round(z.MP - goalMP)} s/km</div></div></div>
    <button class="btn ghost" style="margin-top:6px" onClick=${() => setTab('settings')}>Update fitness →</button>
    <div class="sr-gap"></div>
  </div>`;
}

/* ---------------- Log view ---------------- */
function weekIndexOfDate(dstr) { return Math.floor(Math.round((ymd(dstr) - ymd(PLAN_START)) / 86400000) / 7) + 1; }
function todayStr() { const n = window.__TODAY__ ? new Date(window.__TODAY__) : new Date(); return `${n.getFullYear()}-${pad(n.getMonth() + 1)}-${pad(n.getDate())}`; }

function LogView({ logs, setLogs, unit, prefill, clearPrefill, toast }) {
  const blank = () => ({ date: todayStr(), type: 'aerobic', dist: '', time: '', notes: '' });
  const [f, setF] = useState(blank());
  useEffect(() => { if (prefill) { setF({ date: prefill.date, type: prefill.type, dist: prefill.dist ? String(unit === 'mi' ? +(prefill.dist / MI).toFixed(2) : prefill.dist) : '', time: '', notes: '' }); clearPrefill(); } }, [prefill]);
  const set = (k, v) => setF(o => ({ ...o, [k]: v }));
  const distKm = f.dist ? (unit === 'mi' ? parseFloat(f.dist) * MI : parseFloat(f.dist)) : null;
  const sec = parseTime(f.time);
  const pacePreview = distKm && sec ? paceStr(sec / distKm, unit) : '—';
  function save() {
    if (!distKm || !sec) { toast('Add distance and time'); return; }
    const item = { id: Date.now(), date: f.date, type: f.type, km: +distKm.toFixed(3), sec, notes: f.notes.trim() };
    setLogs([item, ...logs].sort((a, b) => (a.date < b.date ? 1 : -1)));
    setF(blank()); toast('Run logged ✓');
  }
  const dispDist = km => (unit === 'mi' ? (km / MI).toFixed(2) + ' mi' : km.toFixed(1) + ' km');
  const curWk = weekIndexOfDate(todayStr());
  const wkLogs = logs.filter(l => weekIndexOfDate(l.date) === curWk);
  const wkKm = wkLogs.reduce((a, l) => a + l.km, 0);
  const wkTarget = VOL[curWk];
  return html`<div>
    <div class="section-t">Log a Run</div>
    <div class="card">
      <div class="two">
        <label class="field"><span class="lbl">Date</span><input type="date" value=${f.date} onChange=${e => set('date', e.target.value)}/></label>
        <label class="field"><span class="lbl">Session</span>
          <select value=${f.type} onChange=${e => set('type', e.target.value)}>
            ${Object.keys(TYPE_LABEL).filter(k => k !== 'rest').map(k => html`<option value=${k}>${TYPE_LABEL[k]}</option>`)}
          </select></label>
      </div>
      <div class="two">
        <label class="field"><span class="lbl">Distance (${unit})</span><input inputmode="decimal" placeholder=${unit === 'mi' ? 'e.g. 6.2' : 'e.g. 10'} value=${f.dist} onInput=${e => set('dist', e.target.value)}/></label>
        <label class="field"><span class="lbl">Time (h:mm:ss)</span><input inputmode="numeric" placeholder="e.g. 48:30" value=${f.time} onInput=${e => set('time', e.target.value)}/></label>
      </div>
      <div class="row" style="margin:-2px 2px 10px"><span class="lbl">Pace</span><span class="serif" style="font-size:18px">${pacePreview}</span></div>
      <label class="field"><span class="lbl">Notes</span><textarea placeholder="How did it feel? Fuelling, weather, splits…" value=${f.notes} onChange=${e => set('notes', e.target.value)}></textarea></label>
      <button class="btn" onClick=${save}>Save run</button>
    </div>

    <div class="section-t">This Week</div>
    <div class="card"><div class="stat">
      <div><div class="b serif">${unit === 'mi' ? (wkKm / MI).toFixed(1) : wkKm.toFixed(1)}</div><div class="lbl">${unit} logged</div></div>
      <div><div class="b serif">${wkTarget == null ? 'Race' : wkTarget}</div><div class="lbl">week target</div></div>
      <div><div class="b serif">${wkLogs.length}</div><div class="lbl">runs</div></div>
    </div></div>

    <div class="section-t">History ${logs.length ? '(' + logs.length + ')' : ''}</div>
    ${logs.length === 0 && html`<p class="dim" style="margin:2px">No runs logged yet. Your log is saved on this device.</p>`}
    ${logs.length > 0 && html`<div class="card">
      ${logs.map(l => html`<div class="logitem">
        <div style="flex:1">
          <div style="font-weight:600">${dispDist(l.km)} · ${fmtClock(l.sec)} <span class="pill-mini">${TYPE_LABEL[l.type] || l.type}</span></div>
          <div class="m" style="color:var(--muted);font-size:12.5px">${fmtDate(new Date(ymd(l.date)))} · ${paceStr(l.sec / l.km, unit)}${l.notes ? ' · ' + l.notes : ''}</div>
        </div>
        <button class="del" title="Delete" onClick=${() => setLogs(logs.filter(x => x.id !== l.id))}>×</button>
      </div>`)}
    </div>`}
    <div class="sr-gap"></div>
  </div>`;
}

/* ---------------- Settings view ---------------- */
function SettingsView({ settings, setSettings, z, goalMP, exportData, importData, resetAll, toast }) {
  const s = settings;
  const up = (k, v) => setSettings({ ...s, [k]: v });
  const daysToRace = Math.max(0, Math.round((ymd(RACE_DATE) - (window.__TODAY__ ? Date.UTC(new Date(window.__TODAY__).getFullYear(), new Date(window.__TODAY__).getMonth(), new Date(window.__TODAY__).getDate()) : (() => { const n = new Date(); return Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()); })())) / 86400000));
  const fileRef = useRef(null);
  return html`<div>
    <div class="section-t">Configuration</div>

    <div class="card">
      <div class="lbl" style="margin-bottom:8px">Pace unit</div>
      <${Seg} value=${s.unit} onChange=${v => up('unit', v)} options=${[{ v: 'km', l: 'Kilometres' }, { v: 'mi', l: 'Miles' }]}/>
    </div>
    <div class="card">
      <div class="lbl" style="margin-bottom:8px">Appearance</div>
      <${Seg} value=${s.theme} onChange=${v => up('theme', v)} options=${[{ v: 'system', l: 'System' }, { v: 'light', l: 'Light' }, { v: 'dark', l: 'Dark' }]}/>
    </div>

    <div class="card">
      <div class="lbl" style="margin-bottom:4px">Current fitness</div>
      <p class="dim" style="margin:0 0 10px;font-size:13px">A recent race or time-trial. Paces recalculate instantly.</p>
      <div class="two">
        <label class="field"><span class="lbl">Distance</span>
          <select value=${s.curDist} onChange=${e => up('curDist', e.target.value)}>
            <option value="5k">5 km</option><option value="10k">10 km</option><option value="hm">Half</option><option value="full">Marathon</option>
          </select></label>
        <label class="field"><span class="lbl">Time (h:mm:ss)</span><input inputmode="numeric" value=${s.curTime} onChange=${e => up('curTime', e.target.value)}/></label>
      </div>
      <div class="hintbar">Current marathon-equivalent ${fmtClock(z._cur)} · MP ${paceStr(z.MP, s.unit)}</div>
    </div>

    <div class="card">
      <div class="lbl" style="margin-bottom:4px">Goal</div>
      <label class="field" style="margin-top:8px"><span class="lbl">Goal marathon time</span><input inputmode="numeric" value=${s.goalTime} onChange=${e => up('goalTime', e.target.value)}/></label>
      <div class="hintbar">Goal marathon pace ${paceStr(goalMP, s.unit)} · ${Math.round(z.MP - goalMP)} s/km to find</div>
    </div>

    <div class="card">
      <div class="lbl" style="margin-bottom:4px">Race</div>
      <div class="row" style="margin-top:6px"><span>Valencia Marathon</span><span class="dim">Sun 6 Dec 2026</span></div>
      <div class="hintbar"><b style="color:var(--gold)">${daysToRace} days</b> to race · Week ${Math.min(16, Math.max(1, Math.floor(Math.min(111, Math.max(0, todayIndex())) / 7) + 1))} of 16 · starts 2026-08-17</div>
    </div>

    <div class="section-t">Your Data</div>
    <div class="card">
      <p class="dim" style="margin:0 0 10px;font-size:13px">Saved to: <b>${Store.name}</b>. Back it up regularly — export keeps a copy you can re-import on any device.</p>
      <div class="two">
        <button class="btn ghost sm" onClick=${exportData}>⬇ Export backup</button>
        <button class="btn ghost sm" onClick=${() => fileRef.current && fileRef.current.click()}>⬆ Import</button>
      </div>
      <input ref=${fileRef} type="file" accept="application/json" style="display:none" onChange=${e => { const fl = e.target.files[0]; if (fl) importData(fl); e.target.value = ''; }}/>
      <button class="btn ghost sm" style="margin-top:10px;color:#b5473a" onClick=${() => { if (confirm('Erase all logs and settings on this device?')) resetAll(); }}>Reset everything</button>
    </div>
    <p class="dim" style="text-align:center;font-size:12px;margin:14px 2px 4px">Tip: add to your Home Screen for offline use and the most reliable saving.</p>
    <div class="sr-gap"></div>
  </div>`;
}

/* ---------------- App root ---------------- */
const DEF_SETTINGS = { unit: 'km', theme: 'system', curDist: 'full', curTime: '3:26:00', goalTime: '3:10:00' };
const DEF_VIDEOS = { recovery: '', threshold: '', aerobic: '', hills: '', marathon: '', long: '', rest: '' };

function App() {
  const [settings, setSettings] = usePersistent('mtp:settings', DEF_SETTINGS, true);
  const [videos, setVideos] = usePersistent('mtp:videos', DEF_VIDEOS, true);
  const [logs, setLogs] = usePersistent('mtp:logs', []);
  const [tab, setTab] = useState('today');
  const [view, setView] = useState(() => Math.min(111, Math.max(0, todayIndex())));
  const [prefill, setPrefill] = useState(null);
  const [toastMsg, setToastMsg] = useState(null);
  const toast = (m) => { setToastMsg(m); clearTimeout(window.__tt); window.__tt = setTimeout(() => setToastMsg(null), 1800); };

  // theme
  useEffect(() => {
    const mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
    const apply = () => {
      const dark = settings.theme === 'dark' || (settings.theme === 'system' && mq && mq.matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      const tc = document.querySelector('meta[name=theme-color]'); if (tc) tc.setAttribute('content', dark ? '#16140f' : '#f2ecdf');
    };
    apply();
    if (mq && settings.theme === 'system') { mq.addEventListener && mq.addEventListener('change', apply); return () => mq.removeEventListener && mq.removeEventListener('change', apply); }
  }, [settings.theme]);

  // paces
  const { z, goalMP } = useMemo(() => {
    const curSec = marathonEquivSec(DIST[settings.curDist] || MAR, parseTime(settings.curTime) || 3 * 3600 + 26 * 60);
    const zz = zonesFrom(curSec); zz._cur = curSec;
    const goalSec = parseTime(settings.goalTime) || (3 * 3600 + 10 * 60);
    return { z: zz, goalMP: goalSec / MAR };
  }, [settings.curDist, settings.curTime, settings.goalTime]);

  function onLog(session, idx) {
    setPrefill({ date: dateStrOfIndex(idx), type: session.type === 'recovery' ? 'recovery' : session.type, dist: session.km || '' });
    setTab('log');
  }
  function exportData() {
    const blob = new Blob([JSON.stringify({ app: 'marathon-trainer', version: 1, exported: new Date().toISOString(), settings, videos, logs }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'marathon-trainer-backup.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast('Backup downloaded');
  }
  function importData(file) {
    const r = new FileReader();
    r.onload = () => { try { const d = JSON.parse(r.result); if (d.settings) setSettings({ ...DEF_SETTINGS, ...d.settings }); if (d.videos) setVideos({ ...DEF_VIDEOS, ...d.videos }); if (Array.isArray(d.logs)) setLogs(d.logs); toast('Backup imported ✓'); } catch (e) { toast('Could not read that file'); } };
    r.readAsText(file);
  }
  function resetAll() { setSettings(DEF_SETTINGS); setVideos(DEF_VIDEOS); setLogs([]); toast('Reset done'); }

  const unit = settings.unit;
  const cur = z._cur, goal = parseTime(settings.goalTime) || (3 * 3600 + 10 * 60);
  return html`<div class="app">
    <div class="hdr">
      <div class="mark"><div class="logo serif">26</div><div><div class="htxt">Valencia Marathon</div><div class="hsub">Sub-3:10 · 16-week block</div></div></div>
      <div class="count"><b>${Math.max(0, Math.round((ymd(RACE_DATE) - ymd(todayStr())) / 86400000))}</b><span>days to go</span></div>
    </div>
    ${tab === 'today' && html`<${TodayView} view=${view} setView=${setView} settings=${settings} z=${z} goalMP=${goalMP} unit=${unit} videos=${videos} setVideos=${setVideos} onLog=${onLog}/>`}
    ${tab === 'plan' && html`<${PlanView} setView=${setView} setTab=${setTab}/>`}
    ${tab === 'zones' && html`<${ZonesView} z=${z} unit=${unit} goalMP=${goalMP} cur=${cur} goal=${goal} setTab=${setTab}/>`}
    ${tab === 'log' && html`<${LogView} logs=${logs} setLogs=${setLogs} unit=${unit} prefill=${prefill} clearPrefill=${() => setPrefill(null)} toast=${toast}/>`}
    ${tab === 'settings' && html`<${SettingsView} settings=${settings} setSettings=${setSettings} z=${z} goalMP=${goalMP} exportData=${exportData} importData=${importData} resetAll=${resetAll} toast=${toast}/>`}

    ${toastMsg && html`<div class="toast">${toastMsg}</div>`}
    <div class="tabbar">
      ${[['today', 'Today'], ['plan', 'Plan'], ['zones', 'Zones'], ['log', 'Log'], ['settings', 'Settings']].map(([k, l]) =>
        html`<button class=${'tab' + (tab === k ? ' on' : '')} onClick=${() => setTab(k)}><${TabIcon} n=${k}/>${l}</button>`)}
    </div>
  </div>`;
}
function dateStrOfIndex(i) { const d = dateOfIndex(i); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; }

render(html`<${App}/>`, document.getElementById('root'));
</script>
</body>
</html>
